; Board↔env: identify by MAC a4:f0:0f:61:40:18 (led-eth-1); port re-enumerates,
; so no hardcoded upload_port — pass --upload-port at flash time.

[platformio]
default_envs = axismundi

[env:axismundi]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_src_filter = -<*> +<axismundi.cpp>
board_build.partitions = partitions.csv
build_unflags = -Os
build_flags =
    -O2
lib_extra_dirs = ../lib
lib_deps =
    makuna/NeoPixelBus@^2.7
    bblanchon/ArduinoJson@^6.21

; Backyard mockup, one board: led-eth-0 (04:b2:47:82:74:20). Segment/pin
; layout owned by SEG[] in src/axismundi.cpp (AM_MOCKUP block).
[env:axismundi-mockup]
extends = env:axismundi
build_flags =
    -O2
    -DAM_MOCKUP

; Ghost-recorder sandbox: full 4x150 layout (led-eth-1 bench board), buttons
; replaced by per-pot gesture record/replay. Production env above untouched.
[env:axismundi-sandbox]
extends = env:axismundi
build_src_filter = -<*> +<axismundi_sandbox.cpp>

; Sandbox on the backyard mockup board: led-eth-0 (04:b2:47:82:74:20).
[env:axismundi-sandbox-mockup]
extends = env:axismundi-sandbox
build_flags =
    -O2
    -DAM_MOCKUP

; The duck console: ESP32-C3 totem (MAC 38:44:be:45:d9:cc), mic + IMU, sending
; DuckPacketV1 to the receiver above. Its frozen original-duck firmware is a
; different role entirely — see src/duck_sender.cpp.
[env:duck-sender]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
monitor_speed = 460800
build_src_filter = -<*> +<duck_sender.cpp>
lib_extra_dirs = ../lib
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
