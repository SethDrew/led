; Board↔env: identify by MAC b4:bf:e9:c9:01:38 (biolum-b); port re-enumerates.

[env:axismundi]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-1120
monitor_port = /dev/cu.usbserial-1120
upload_speed = 460800
monitor_speed = 115200
build_src_filter = -<*> +<axismundi.cpp>
board_build.partitions = partitions.csv
build_unflags = -Os
build_flags =
    -O2
lib_extra_dirs = ../lib
lib_deps =
    makuna/NeoPixelBus@^2.7
    bblanchon/ArduinoJson@^6.21
