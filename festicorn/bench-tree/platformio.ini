; LED Tree + Strip — ESP32
;
; Tree: sap flow on 3 strips (pins 27/13/14, 197 LEDs)
; Strip: OKLCH rainbow on pin 32 (150 LEDs)
; WiFi + OTA enabled

[platformio]
default_envs = esp32_tree_sap

[env:esp32_tree_sap]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-0001
upload_speed = 921600
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>
build_flags = -DSTRIP1_PIN=27 -DSTRIP2_PIN=13 -DSTRIP3_PIN=14
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; --- ESP32-C3 standalone sap-flow ---
; Seeed XIAO ESP32-C3. The C3 has only 2 RMT TX channels, but Adafruit
; NeoPixel 1.15.x on Arduino-ESP32 3.x (ESP-IDF 5) drives all instances
; through ONE shared, mutex-serialized RMT channel (re-pointed per show()),
; so 3 separate Adafruit_NeoPixel instances on 3 pins work on the C3.
;
; C3 GPIO mapping (XIAO silk -> GPIO):
;   STRIP1 = D2 = GPIO4   (was 27)
;   STRIP2 = D3 = GPIO5   (was 13)
;   STRIP3 = D4 = GPIO6   (was 14)
; Chosen because GPIO4/5/6 are general-purpose, non-strapping, and not on
; the flash (6-11) or USB-JTAG (18/19) lines. The original 27/13/14 are not
; valid broken-out C3 GPIOs.
[env:c3_tree_sap]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>
build_flags = -DSTRIP1_PIN=4 -DSTRIP2_PIN=5 -DSTRIP3_PIN=6
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

[env:esp32_tree_rainbow]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-0001
upload_speed = 921600
monitor_speed = 115200
build_src_filter = -<*> +<tree_rainbow_test.cpp>
build_flags = -DSTRIP1_PIN=27 -DSTRIP2_PIN=13 -DSTRIP3_PIN=14 -DTEST_STRIP_PIN=32 -DTEST_STRIP_LEDS=150
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

[env:rgb_test]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-0001
upload_speed = 921600
monitor_speed = 115200
build_src_filter = -<*> +<rgb_test.cpp>
build_flags = -DPIN_A=32 -DPIN_B=12 -DNUM_LEDS=30
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
