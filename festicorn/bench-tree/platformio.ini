; LED Tree — ESP32-C3 standalone
;
; Forest-green sap flow on 3 strips (197 LEDs), driven from one C3.
;
; The C3 has only 2 RMT TX channels, but Adafruit NeoPixel 1.15.x on
; Arduino-ESP32 3.x (ESP-IDF 5) drives all instances through ONE shared,
; mutex-serialized RMT channel (re-pointed per show()), so 3 separate
; Adafruit_NeoPixel instances on 3 pins work fine on the C3.
;
; Wiring (board silk is raw GPIO numbers):
;   STRIP1 = GPIO5  (92 LEDs, lower trunk + branches A/B)
;   STRIP2 = GPIO6  (6 LEDs, side branch C)
;   STRIP3 = GPIO7  (99 LEDs, upper trunk + branches D/E)
; GPIO5/6/7 are general-purpose, non-strapping, and clear of the flash
; (12-17) and USB-JTAG (18/19) lines.

[platformio]
default_envs = c3_tree_sap

[env:c3_tree_sap]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
upload_port = /dev/cu.usbmodem112201
monitor_port = /dev/cu.usbmodem112201
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>
build_flags = -DSTRIP1_PIN=5 -DSTRIP2_PIN=6 -DSTRIP3_PIN=7
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
