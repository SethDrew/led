[platformio]
default_envs = clicky-pots

[env:clicky-pots]
platform = espressif32
board = esp32dev
framework = arduino, espidf
upload_port = /dev/cu.usbserial-2120
upload_speed = 115200
monitor_port = /dev/cu.usbserial-2120
monitor_speed = 230400
lib_extra_dirs = ../lib
lib_deps = adafruit/Adafruit ADS1X15@^2.5.0
