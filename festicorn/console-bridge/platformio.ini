; console-bridge — ESP-NOW → USB bridge for tools/console-dashboard: forwards
; every packet heard on channel 1 as A5 5A-framed serial (see src/bridge.cpp).
; Lets the dashboard hear the wireless consoles without opening their USB
; ports (opening a CH340 port resets the board).
; env:sniffer is a generic ESP-NOW debug listener: channel-hopping, per-MAC
; sender table. Flash to any spare board to verify senders are visible.

[env:bridge]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
build_src_filter = -<*> +<bridge.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:sniffer]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_src_filter = -<*> +<generic_sniffer.cpp>

[env:seq-probe]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_src_filter = -<*> +<seq_probe.cpp>
