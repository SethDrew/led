; throwaway render benchmark for the helix-canopy effects on real ESP32 hardware
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-11220
monitor_port = /dev/cu.usbserial-11220
upload_speed = 460800
; include the REAL effects.h + topology.h (no copies); -O2 matches the host sim
build_flags = -I../src -I../geometry -O2

[env:heavy]
; nebula_az + creatures_az (the two with the biggest static scratch)

[env:light]
build_flags = ${env.build_flags} -DLIGHT_BATCH

[env:grid]
build_flags = ${env.build_flags} -DGRID_BENCH
