; kettle-knob — Axis Mundi input console (salvaged water-heater encoder + 5 buttons).
; ESP32-C3 Super Mini; wiring + TX-defect caveat: catalog/boards.yaml role kettle-knob.

[env:kettle-knob]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
lib_extra_dirs = ../lib
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
