; Board 14:63:93:70:42:AC (see catalog/boards.yaml) — usbmodem suffix
; reshuffles on replug; verify with esptool read_mac if uncertain.

[platformio]
default_envs = mobile

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
upload_port = /dev/cu.usbmodem21201
monitor_port = /dev/cu.usbmodem21201
lib_extra_dirs = ../lib
lib_deps =
    makuna/NeoPixelBus@^2.7

[env:mobile]
build_src_filter = -<*> +<mobile.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLED_PIN_A=3
    -DLED_PIN_B=4
    -DLED_COUNT_A=50
    -DLED_COUNT_B=50
    -DBUTTON_PIN=2

[env:rainbow_blue]
build_src_filter = -<*> +<rainbow_blue.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLED_PIN_A=3
    -DLED_PIN_B=4
    -DLED_COUNT_A=30
    -DLED_COUNT_B=30
    -DBUTTON_PIN=2
    -DGYRO_SDA=6
    -DGYRO_SCL=5
