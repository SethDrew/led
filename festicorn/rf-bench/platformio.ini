[platformio]
default_envs = rfbench-esp32

[common]
build_src_filter = -<*> +<rfbench.cpp>
monitor_speed = 115200

[env:rfbench-esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = ${common.build_src_filter}
monitor_speed = ${common.monitor_speed}
upload_speed = 460800

[env:rfbench-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = ${common.build_src_filter}
monitor_speed = ${common.monitor_speed}
upload_speed = 460800
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:rfnode-esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<rfnode.cpp>
monitor_speed = ${common.monitor_speed}
upload_speed = 460800

[env:rfnode-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = -<*> +<rfnode.cpp>
monitor_speed = ${common.monitor_speed}
upload_speed = 460800
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
