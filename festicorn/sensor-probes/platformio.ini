[platformio]
default_envs = tcs3472_probe

[env:tcs3472_probe]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
monitor_speed = 460800
build_src_filter = -<*> +<tcs3472_probe.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:bno08x_probe]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
monitor_speed = 460800
monitor_filters = direct
; Bench board 14:63:93:6f:ff:78 enumerates as usbmodem1*; the other C3 on this
; desk is usbmodem2*, and bare auto-detect grabs the classic ESP32 instead.
monitor_port = /dev/cu.usbmodem1*
upload_port = /dev/cu.usbmodem1*
build_src_filter = -<*> +<bno08x_probe.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPROBE_SDA=2
    -DPROBE_SCL=3
    -DPROBE_CS=0
    -DPROBE_ADD=1
    -DPROBE_INT=10
    -DPROBE_RST=5
    -DPROBE_I2S_WS=21
    -DPROBE_I2S_SCK=20
    -DPROBE_I2S_SD=9
lib_deps =
    adafruit/Adafruit BNO08x@^1.2.5

; Parks SCL at a static 0 V and does nothing else, so a DC meter reading at the
; module pad is unambiguous. Reflash env:bno08x_probe when done measuring.
[env:bno08x_meter]
extends = env:bno08x_probe
build_flags =
    ${env:bno08x_probe.build_flags}
    -DPROBE_METER_HOLD=1

; Live per-wire continuity readout at 4 Hz. Reseat a wire and watch its column
; flip green. GPIO5/6 are unwired reference columns.
[env:bno08x_wires]
extends = env:bno08x_probe
build_flags =
    ${env:bno08x_probe.build_flags}
    -DPROBE_MONITOR=1
