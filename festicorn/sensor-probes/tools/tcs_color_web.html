<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TCS3472 Color Viewer</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #1a1a1e; color: #eee;
         display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #swatches { width: 100%; height: 45vh; display: flex; }
  .swatch { flex: 1; transition: background 0.12s linear;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .swatch .hex { font-size: 1.2em; font-family: monospace; padding: 6px 12px; margin-bottom: 12px;
         background: rgba(0,0,0,0.45); border-radius: 8px; }
  .swatch .tag { color: rgba(255,255,255,0.6); font-size: 0.8em; margin-bottom: 6px;
                 text-shadow: 0 0 4px black; }
  .panel { padding: 24px; width: min(480px, 90vw); }
  .row { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
  .row label { width: 90px; }
  input[type=range] { flex: 1; }
  button, select { font-size: 1em; padding: 8px 18px; border-radius: 8px; border: none;
           background: #3b6ef5; color: white; cursor: pointer; }
  select { background: #333; }
  #raw { font-family: monospace; color: #999; white-space: pre; }
  #status { color: #999; }
</style>
</head>
<body>
<div id="swatches">
  <div class="swatch" id="swatchC"><div class="tag">C-scaled</div><div class="hex">—</div></div>
  <div class="swatch" id="swatchRGB"><div class="tag">RGB only</div><div class="hex">—</div></div>
</div>
<div class="panel">
  <div class="row">
    <button id="connect">Connect</button>
    <span id="status">not connected</span>
  </div>
  <div class="row">
    <label>LED</label>
    <input type="range" id="led" min="0" max="255" value="255">
    <span id="ledval">255</span>
  </div>
  <div class="row">
    <label>Gain</label>
    <select id="gain">
      <option value="0">1×</option>
      <option value="1" selected>4×</option>
      <option value="2">16×</option>
      <option value="3">60×</option>
    </select>
  </div>
  <div class="row"><div id="raw">C=— R=— G=— B=—</div></div>
</div>
<script>
let writer = null;

async function send(line) {
  if (writer) await writer.write(new TextEncoder().encode(line + "\n"));
}

function render(c, r, g, b) {
  document.getElementById("raw").textContent = `C=${c} R=${r} G=${g} B=${b}`;
  const m = Math.max(r, g, b, 1);
  const brightC = Math.min(1, c / 400);
  const gamma = v => Math.round(255 * Math.pow(brightC * v / m, 1 / 2.2));
  setSwatch("swatchC", gamma(r), gamma(g), gamma(b));
  setSwatch("swatchRGB", Math.min(255, r), Math.min(255, g), Math.min(255, b));
}

function setSwatch(id, r, g, b) {
  const hex = "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
  const el = document.getElementById(id);
  el.style.background = hex;
  el.querySelector(".hex").textContent = `${hex}  rgb(${r}, ${g}, ${b})`;
}

document.getElementById("connect").onclick = async () => {
  const port = await navigator.serial.requestPort();
  await port.open({ baudRate: 460800 });
  writer = port.writable.getWriter();
  document.getElementById("status").textContent = "connected";
  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable);
  const reader = decoder.readable.getReader();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines) {
      const m = line.match(/\[tcs\] C=(\d+) R=(\d+) G=(\d+) B=(\d+)/);
      if (m) render(+m[1], +m[2], +m[3], +m[4]);
    }
  }
};

const ledSlider = document.getElementById("led");
ledSlider.oninput = () => document.getElementById("ledval").textContent = ledSlider.value;
ledSlider.onchange = () => send("L " + ledSlider.value);
document.getElementById("gain").onchange = e => send("G " + e.target.value);
</script>
</body>
</html>
