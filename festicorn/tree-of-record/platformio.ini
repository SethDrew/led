; Board↔env mapping, MACs, pins: festicorn/catalog/boards.yaml (identify by MAC;
; CH340 ports re-enumerate). Test/diag envs (dac_test, wav_play, si-*,
; kaylab-sniff) — reflash the board's real firmware after.

[env:tree-of-record-v1]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-1130
upload_speed = 460800
monitor_port = /dev/cu.usbserial-1130
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>
board_build.partitions = partitions.csv
build_unflags = -Os
build_flags =
    -O2
    -DLEDS_PER_STRIP=100
lib_extra_dirs = ../lib
lib_deps =
    makuna/NeoPixelBus@^2.7
    bblanchon/ArduinoJson@^6.21

[env:tree-of-record-v2]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11440
monitor_port = /dev/cu.usbserial-11440
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSTRIP1_PIN=16

[env:dac_test]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11440
monitor_port = /dev/cu.usbserial-11440
build_src_filter = -<*> +<dac_test.cpp>
build_flags =
    -O2

[env:wav_play]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11440
monitor_port = /dev/cu.usbserial-11440
build_src_filter = -<*> +<wav_play.cpp>
build_flags =
    -O2

[env:tree-of-record-eth]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
build_src_filter = -<*> +<tree_of_record_eth.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150

[env:streaming-eth]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
build_src_filter = -<*> +<streaming_receiver_eth.cpp>
build_flags =
    -O2
    -DNUM_LEDS=150

[env:wormhole]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11130
monitor_port = /dev/cu.usbserial-11130
build_src_filter = -<*> +<wormhole.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSTRIP1_PIN=15

[env:wormhole-eth]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-111430
monitor_port = /dev/cu.usbserial-111430
build_src_filter = -<*> +<wormhole_eth.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150

[env:si-test]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-111430
monitor_port = /dev/cu.usbserial-111430
build_src_filter = -<*> +<si_test.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSI_NUM_STRIPS=4
    -DSI_PIN0=13 -DSI_PIN1=27 -DSI_PIN2=32 -DSI_PIN3=33

[env:si-test-biolum]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11130
monitor_port = /dev/cu.usbserial-11130
build_src_filter = -<*> +<si_test.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSI_NUM_STRIPS=6
    -DSI_PIN0=4 -DSI_PIN1=15 -DSI_PIN2=17 -DSI_PIN3=5 -DSI_PIN4=18 -DSI_PIN5=19

[env:si-xtalk]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-111430
monitor_port = /dev/cu.usbserial-111430
build_src_filter = -<*> +<si_xtalk.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSI_NUM_STRIPS=4
    -DSI_PIN0=13 -DSI_PIN1=27 -DSI_PIN2=32 -DSI_PIN3=33

[env:kaylab-sniff]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-111440
monitor_port = /dev/cu.usbserial-111440
build_src_filter = -<*> +<kaylab_sniff.cpp>
build_flags =
    -O2
    -DSNIFF_LOCK_CHANNEL=1

[env:canbus-eth0]
extends = env:tree-of-record-v1
extra_scripts = pre:../catalog/pio_board_lookup.py
custom_board_id = led-eth-0
build_src_filter = -<*> +<canbus_test.cpp>
build_flags =
    -O2

[env:canbus-eth1]
extends = env:canbus-eth0
custom_board_id = led-eth-1

[env:canbus-eth2]
extends = env:canbus-eth0
custom_board_id = led-eth-2

[env:canbus-clicky]
extends = env:canbus-eth0
custom_board_id = clicky-pots
upload_speed = 115200

[env:canbus-biolumb]
extends = env:canbus-eth0
custom_board_id = biolum-b

[env:canbus-flood]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
build_src_filter = -<*> +<canbus_throughput.cpp>
build_flags =
    -O2
    -DROLE_FLOOD
    -DCAN_KBPS=1000
    -DTX_PATTERN=1
    -DTX_DLC=8

[env:canbus-sink]
extends = env:canbus-flood
upload_port = /dev/cu.usbserial-210
monitor_port = /dev/cu.usbserial-210
build_flags =
    -O2
    -DROLE_SINK
    -DCAN_KBPS=1000
    -DTX_PATTERN=1
    -DTX_DLC=8

[env:canbus-selftest]
extends = env:tree-of-record-v1
build_src_filter = -<*> +<canbus_test.cpp>
build_flags =
    -O2
    -DCAN_SELFTEST

[env:canbus-pinfind]
extends = env:tree-of-record-v1
build_src_filter = -<*> +<canbus_pinfind.cpp>
build_flags =
    -O2

[env:canbus-park]
extends = env:tree-of-record-v1
build_src_filter = -<*> +<canbus_park.cpp>
build_flags =
    -O2

[env:canbus-sink2]
extends = env:canbus-sink
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

[env:si-xtalk-biolum]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11130
monitor_port = /dev/cu.usbserial-11130
build_src_filter = -<*> +<si_xtalk.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSI_NUM_STRIPS=6
    -DSI_PIN0=4 -DSI_PIN1=15 -DSI_PIN2=17 -DSI_PIN3=5 -DSI_PIN4=18 -DSI_PIN5=19
