; Tree-of-record — audio record/playback installation. ESP32-D0WD-V3,
; 6× WS2812B RGB strips on RMT 0..5. Receives BS-26 state packets + duck
; telemetry/audio over ESP-NOW (channel 1); records LED+audio to 5 slots
; and plays them back, with audio out the GPIO25 DAC jack.
;
; Boards in this installation:
;   env:tree-of-record-v1  — original board. Pins 4/15/17/5/18/19, 100 LEDs.
;                            MAC ?  (legacy; slated to become a sparkle rig).
;   env:tree-of-record-v2  — current deployment board. Pins 4/16/17/5/18/19,
;                            150 LEDs. MAC F4:2D:C9:6D:B2:58 (was "biolum-a").
;   env:wormhole           — entrance piece on biolum-b (MAC
;                            B4:BF:E9:C9:01:38). Pins 4/15/17/5/18/19,
;                            150 LEDs. Standalone ambient (wormhole.cpp).
; v1/v2 differ only in strip1 pin (15→16) and LED count (100→150); the
; firmware is identical. Boards re-enumerate (CH340) — override the port
; at the CLI.

[env:tree-of-record-v1]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-1130
upload_speed = 460800
monitor_port = /dev/cu.usbserial-1130
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>
board_build.partitions = partitions.csv
build_unflags = -Os
build_flags =
    -O2
    -DLEDS_PER_STRIP=100
lib_extra_dirs = ../lib
lib_deps =
    makuna/NeoPixelBus@^2.7
    bblanchon/ArduinoJson@^6.21

; tree-of-record-v2 — current deployment board (MAC F4:2D:C9:6D:B2:58,
; formerly "biolum-a"). strip1 on GPIO 16, 150 LEDs/strip. Everything else
; — audio record/playback, BS-26, DAC on GPIO25 — identical to v1.
[env:tree-of-record-v2]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11440
monitor_port = /dev/cu.usbserial-11440
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSTRIP1_PIN=16

; dac_test — GPIO25 / 3.5mm jack bring-up. Plays a repeating A-major
; arpeggio through the internal DAC using the same I2S config as real
; playback. No LEDs, no network — isolates the analog wiring. Flash this
; to verify the jack, then reflash tree-of-record-v2 to restore.
[env:dac_test]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11440
monitor_port = /dev/cu.usbserial-11440
build_src_filter = -<*> +<dac_test.cpp>
build_flags =
    -O2

; wav_play — loop the embedded raw no-boost capture (wav_samples.h) through
; the GPIO25 DAC. Real audio through the real DAC path. Reflash
; tree-of-record-v2 after.
[env:wav_play]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11440
monitor_port = /dev/cu.usbserial-11440
build_src_filter = -<*> +<wav_play.cpp>
build_flags =
    -O2

; tree-of-record-eth — the full tree-of-record receiver + effect catalog on
; led-eth-0 (MAC 04:B2:47:82:74:20), remapped from 6 strips to 4 on GPIO
; 13/27/32/33 (GRB). Same ESP-NOW receiver, same BS-26 knob mapping — scan
; effects with the decouter ring (0–10). Forked source: tree_of_record_eth.cpp.
[env:tree-of-record-eth]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
build_src_filter = -<*> +<tree_of_record_eth.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150

; streaming-eth — host-streamed pixel sink on led-eth (MAC A4:F0:0F:61:40:18).
; The laptop renders audio-reactive effects and streams RGB frames over USB
; serial; this firmware mirrors each frame across all 4 strips. Pair with the
; `tree_eth` sculpture/controller in the audio-reactive viewer. 4× WS2812, 150
; LEDs each, GPIO 13/27/32/33. Identify-by-MAC (0xFE). CH340 @ 460800 — override
; the port at the CLI by MAC.
[env:streaming-eth]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
build_src_filter = -<*> +<streaming_receiver_eth.cpp>
build_flags =
    -O2
    -DNUM_LEDS=150

; wormhole — entrance piece to the tree of record, on its own board
; (biolum-b, MAC B4:BF:E9:C9:01:38; strip1 on GPIO 15 unlike the v2 tree
; board). Slow ambient sparkle fade in rust + soft whites. Standalone:
; no radio, no sensors. 6× WS2812B strips, 150 LEDs each.
[env:wormhole]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11130
monitor_port = /dev/cu.usbserial-11130
build_src_filter = -<*> +<wormhole.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSTRIP1_PIN=15

; wormhole-eth — 4-strip wormhole on board led-eth-0 (MAC 04:B2:47:82:74:20),
; the LED-data-over-ethernet-cable rig (cable is just the conductor, NOT
; networked). 4× WS2812 strips, 150 LEDs each, on GPIO 13/27/32/33. Pins are
; hardcoded in wormhole_eth.cpp (not STRIP1_PIN-parameterized). Tuned denser:
; ~60% lit vs ~41% on biolum-b. CH340 — override the port at the CLI by MAC.
[env:wormhole-eth]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-111430
monitor_port = /dev/cu.usbserial-111430
build_src_filter = -<*> +<wormhole_eth.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150

; si-test — WS2812 signal-integrity / reflection stress for led-eth-0. Dim
; uniform fields at max refresh; bit errors from data-line reflections show
; as bright/wrong sparks. Diagnostic only — reflash env:wormhole-eth after.
[env:si-test]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-111430
monitor_port = /dev/cu.usbserial-111430
build_src_filter = -<*> +<si_test.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSI_NUM_STRIPS=4
    -DSI_PIN0=13 -DSI_PIN1=27 -DSI_PIN2=32 -DSI_PIN3=33

; si-test-biolum — the SAME si_test.cpp on biolum-b (MAC B4:BF:E9:C9:01:38),
; the direct-wired (non-ethernet) control board. 6 strips on GPIO 4/15/17/5/
; 18/19, 150 LEDs. Run identical TRANS-AA/HEAD-AA stress here: clean on biolum
; while led-eth-0 glitches ⇒ the fault is in the ethernet-cable signal path,
; not firmware/RMT/strips. CH340 re-enumerates — verify port by MAC.
[env:si-test-biolum]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11130
monitor_port = /dev/cu.usbserial-11130
build_src_filter = -<*> +<si_test.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSI_NUM_STRIPS=6
    -DSI_PIN0=4 -DSI_PIN1=15 -DSI_PIN2=17 -DSI_PIN3=5 -DSI_PIN4=18 -DSI_PIN5=19

; si-xtalk — crosstalk / shared-ground-return discriminator on led-eth-0.
; Decorrelated per-line data (SOLO-sK vs VICT-sK) to expose inter-line
; coupling that si_test's identical-data drive is blind to.
[env:si-xtalk]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-111430
monitor_port = /dev/cu.usbserial-111430
build_src_filter = -<*> +<si_xtalk.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSI_NUM_STRIPS=4
    -DSI_PIN0=13 -DSI_PIN1=27 -DSI_PIN2=32 -DSI_PIN3=33

; kaylab-sniff — ESP-NOW presence sniffer (no LEDs). Channel-hops 1..13 and
; reports whether the BS-26/Kaylab (E0:8C:FE:57:A1:18) is transmitting and on
; which channel. Flash to a spare board near Kaylab (e.g. biolum-B). Diagnostic
; only — reflash the board's real firmware after.
[env:kaylab-sniff]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-111440
monitor_port = /dev/cu.usbserial-111440
build_src_filter = -<*> +<kaylab_sniff.cpp>
build_flags =
    -O2
    -DSNIFF_LOCK_CHANNEL=1

; si-xtalk-biolum — same crosstalk test on the direct-wired control biolum-b.
[env:si-xtalk-biolum]
extends = env:tree-of-record-v1
upload_port = /dev/cu.usbserial-11130
monitor_port = /dev/cu.usbserial-11130
build_src_filter = -<*> +<si_xtalk.cpp>
build_flags =
    -O2
    -DLEDS_PER_STRIP=150
    -DSI_NUM_STRIPS=6
    -DSI_PIN0=4 -DSI_PIN1=15 -DSI_PIN2=17 -DSI_PIN3=5 -DSI_PIN4=18 -DSI_PIN5=19
